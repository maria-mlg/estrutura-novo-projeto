<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi Design</title>
</head>
<body>
    <header>
        <h1>Lumi Design</h1>
        <nav>
            <a href="index.html">Início</a> <br>
            <a href="agendamento.html">Agendamento</a> <br>
            <a href="portfólios.html">Conheça nossos projetos</a> <br>
            <a href="sobre.html">Sobre a empresa</a> <br>
        </nav>
        </header>
        <main>
            <h2><strong>Agende sua consultoria</strong></h2>
             <form action="#" method="post">
                <label for="nome">Nome Completo:</label>
                <input type="text" name="nome" id="nome">
                <br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
                <br>
                <label for="telefone">Telefone:</label>
                <input type="tel"
                 name="telefone"
                  id="telefone"
                  required
                  inputmode="numeric"
                  maxlength="15"
                  pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                  title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321"
                  >
                <br>
                <label for="data">Data:</label> 
                <input type="date" name="data" id="data">
                <br>
                <label for="hora">Horário:</label>
                <input type="time" name="hora" id="hora">
                <br>
                 <label for="Contratação">Contratação:</label> 
                <select name="Contratação" id="Contratação">
                    <option value="">Selecione uma opção</option>
                    <br>  
                    <option value="Identidadevisual">Identidade visual</option>
                    <option value="Sites">Sites</option>
                    <option value="Logos">Logos</option>
                    <option value="Materiais">Materiais</option>
                </select>
        </main>
         <br>
                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" rows="4"></textarea>
                <br>
                <button type="submit">Confirmar consultoria</button>
            </form>
        </main>

        <footer>
            <p><br>
                © 2026 Lumi Design - Todos os direitos reservados. 
               
            </p>
        </footer>
</body>

</html>
